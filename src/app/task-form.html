<form [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <label for="title">Titre *</label>
    <input 
      id="title" 
      type="text" 
      formControlName="title"
      placeholder="Ex: Faire les courses"
    />
    <!-- Message d'erreur affiché si le champ a été touché et qu'il est invalide -->
    @if (form.controls.title.touched && form.controls.title.invalid) {
      <p class="form-error">Le titre doit contenir au moins 3 caractères.</p>
    }
  </div>

  <div>
    <label for="description">Description (optionnelle)</label>
    <textarea id="description" formControlName="description"></textarea>
  </div>

  <div>
    <label for="dueDate">Échéance (optionnelle)</label>
    <input 
      id="dueDate" 
      type="date" 
      formControlName="dueDate" 
    />
    @if (form.controls.dueDate.touched && form.controls.dueDate.invalid) {
      <p class="form-error">La date doit être valide et au plus tôt aujourd'hui.</p>
    }
  </div>

  <!-- Le bouton est désactivé si le formulaire global n'est pas valide -->
  <button type="submit" [disabled]="form.invalid">Ajouter</button>
</form>
